<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>S.R. PRIME MART – Price Quotation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f3;
      --card: #ffffff;
      --ink: #14282e;
      --mute: #566b72;
      --line: #d3dde0;
      --acc: #0b6b66;
      --acc-hover: #085450;
      --acc-ink: #ffffff;
      --warn: #b3261e;
      --soft: #dcefed;
      --shadow: 0 2px 10px rgba(20, 40, 46, 0.05);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1a1d;
        --card: #15262a;
        --ink: #e6f0f1;
        --mute: #97aeb3;
        --line: #26393e;
        --acc: #4fc3bb;
        --acc-hover: #6ad3cc;
        --acc-ink: #06201e;
        --warn: #ff8a80;
        --soft: #1b3a3d;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.28);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0e1a1d;
      --card: #15262a;
      --ink: #e6f0f1;
      --mute: #97aeb3;
      --line: #26393e;
      --acc: #4fc3bb;
      --acc-hover: #6ad3cc;
      --acc-ink: #06201e;
      --warn: #ff8a80;
      --soft: #1b3a3d;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.28);
      color-scheme: dark;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 18px 14px 56px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(1.45rem, 4vw, 1.85rem);
      line-height: 1.2;
      margin: 0 0 4px;
      font-weight: 700;
    }

    .sub {
      color: var(--mute);
      margin: 0;
      font-size: 0.95rem;
    }

    .sticky-actions {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 10;
      background: var(--bg);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 0;
      margin-bottom: 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 1.12rem;
      margin: 0;
      font-weight: 600;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 170px;
      gap: 10px;
      margin-bottom: 14px;
    }

    .inline-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.88rem;
      color: var(--mute);
    }

    input, select {
      width: 100%;
      font-family: inherit;
      font-size: 0.96rem;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      min-height: 42px;
    }

    input:focus, select:focus, button:focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 2px;
    }

    button {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.92rem;
      border-radius: 8px;
      padding: 9px 14px;
      min-height: 40px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-pri {
      background: var(--acc);
      color: var(--acc-ink);
      border: 1px solid var(--acc);
      flex: 1 1 auto;
    }

    .btn-pri:hover {
      background: var(--acc-hover);
    }

    .btn-sec {
      background: transparent;
      color: var(--acc);
      border: 1px solid var(--acc);
    }

    .btn-sec:hover {
      background: var(--soft);
    }

    .btn-ghost {
      background: transparent;
      color: var(--mute);
      border: 1px solid var(--line);
    }

    .btn-ghost:hover {
      color: var(--ink);
      border-color: var(--acc);
    }

    .btn-sm {
      padding: 6px 10px;
      min-height: 34px;
      font-size: 0.84rem;
    }

    button.x {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--warn);
      padding: 6px 10px;
      min-height: 36px;
    }

    button.x:hover {
      background: rgba(179, 38, 30, 0.08);
    }

    .wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 540px;
    }

    th {
      font-size: 0.84rem;
      color: var(--mute);
      text-align: left;
      font-weight: 600;
      padding: 6px 5px;
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 6px 5px;
      vertical-align: middle;
    }

    td.n input { min-width: 170px; }
    td.p input { width: 105px; }
    td.q input { width: 76px; }
    td.t { white-space: nowrap; font-weight: 600; }

    .table-actions {
      margin-top: 10px;
    }

    .sum {
      background: var(--soft);
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sum div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .sum .big {
      font-weight: 700;
      font-size: 1.25rem;
      padding-top: 6px;
      margin-top: 2px;
      border-top: 1px solid var(--line);
    }

    .hidden {
      display: none !important;
    }

    label[for="zs"] {
      display: block;
      font-size: 0.88rem;
      color: var(--mute);
      margin-bottom: 6px;
    }

    .delivery-info {
      margin: 12px 0 0;
    }

    .delivery-info div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .delivery-info div:first-child {
      border-top: 0;
      padding-top: 4px;
    }

    .delivery-info dt { color: var(--mute); }
    .delivery-info dd { margin: 0; font-weight: 600; }

    @media (max-width: 600px) {
      .field-row { grid-template-columns: 1fr; }
      .sticky-actions .btn-pri { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div>
        <h1>S.R. PRIME MART</h1>
        <p class="sub">Price Quotation &amp; Order Assistant</p>
      </div>
      <button type="button" id="themeToggle" class="btn-ghost" aria-label="Toggle theme">Theme</button>
    </header>

    <div class="sticky-actions" role="region" aria-label="Quick copy actions">
      <button type="button" id="cpy" class="btn-pri">Copy Price Quotation</button>
      <button type="button" id="ofb" class="btn-pri">Copy Order Form</button>
      <button type="button" id="fbb" class="btn-pri">Copy Facebook Page Message</button>
    </div>

    <section class="card">
      <div class="section-head">
        <h2>Products &amp; Pricing</h2>
        <button type="button" id="clearAll" class="btn-ghost btn-sm">Reset</button>
      </div>

      <div class="field-row">
        <label class="inline-field">
          <span>Customer Name (Optional)</span>
          <input type="text" id="custName" placeholder="Customer name">
        </label>
        <label class="inline-field">
          <span>Discount (Tk)</span>
          <input type="number" id="discount" inputmode="decimal" min="0" placeholder="0">
        </label>
      </div>

      <div class="wrap">
        <table>
          <thead>
            <tr>
              <th>Product Name</th>
              <th>Price (Tk)</th>
              <th>Qty</th>
              <th>Total</th>
              <th aria-label="Remove"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="table-actions">
        <button type="button" id="add" class="btn-sec">+ Add product</button>
      </div>

      <div class="sum">
        <div><span>Subtotal</span><span id="sub">Tk 0</span></div>
        <div id="discRow" class="hidden"><span>Discount</span><span id="discVal">- Tk 0</span></div>
        <div><span>Delivery Charge</span><span id="dc">Tk 70</span></div>
        <div class="big"><span>Total Payment</span><span id="tot">Tk 0</span></div>
        <div><span>Payment</span><strong>Full Cash on Delivery</strong></div>
      </div>
    </section>

    <section class="card">
      <h2>Delivery Time &amp; Area</h2>
      <label for="zs">Select Delivery Area</label>
      <select id="zs" aria-label="Delivery area">
        <option value="0">Inside Dhaka</option>
        <option value="1">Dhaka sub areas</option>
        <option value="2">Outside Dhaka</option>
      </select>

      <dl class="delivery-info">
        <div>
          <dt id="dn">Inside Dhaka</dt>
          <dd id="d0">1-2 days</dd>
        </div>
        <div>
          <dt>Contact &amp; Page</dt>
          <dd>01600-445389 • S.R. PRIME MART</dd>
        </div>
      </dl>
    </section>
  </main>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const STORAGE_KEY = "sr_prime_mart_quote_v2";
      const ZN = [
        ["Inside Dhaka", 1, 2, 70],
        ["Dhaka sub areas", 2, 3, 110],
        ["Outside Dhaka", 2, 3, 130]
      ];

      let state = {
        custName: "",
        discount: "",
        zoneIndex: 0,
        items: [{ n: "", p: "", q: 1 }]
      };

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved.items) && saved.items.length) {
            state.custName = typeof saved.custName === "string" ? saved.custName : "";
            state.discount = saved.discount ?? "";
            state.zoneIndex = Number.isInteger(saved.zoneIndex) && ZN[saved.zoneIndex] ? saved.zoneIndex : 0;
            state.items = saved.items.map((it) => ({
              n: String(it.n || ""),
              p: it.p === "" || it.p == null ? "" : it.p,
              q: Math.max(1, parseInt(it.q, 10) || 1)
            }));
          }
        } catch (_) {}
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (_) {}
      }

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
        }[c]));
      }

      function num(v) {
        const n = parseFloat(v);
        return Number.isNaN(n) || n < 0 ? 0 : n;
      }

      function tk(n) {
        return "Tk " + (Math.round(n * 100) / 100).toLocaleString("en-US");
      }

      function fdt(daysAhead) {
        const d = new Date();
        d.setDate(d.getDate() + daysAhead);
        return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
      }

      function dtxt(z) {
        return `${z[1]}-${z[2]} days (${fdt(z[1])} to ${fdt(z[2])})`;
      }

      function fillDel() {
        const z = ZN[state.zoneIndex];
        $("dn").textContent = z[0];
        $("d0").textContent = dtxt(z);
      }

      function renderRows() {
        $("rows").innerHTML = state.items.map((it, i) => `
          <tr>
            <td class="n"><input type="text" data-i="${i}" data-f="n" value="${esc(it.n)}" placeholder="Product name" aria-label="Product Name"></td>
            <td class="p"><input type="number" inputmode="decimal" min="0" step="any" data-i="${i}" data-f="p" value="${esc(it.p)}" placeholder="0" aria-label="Price"></td>
            <td class="q"><input type="number" inputmode="numeric" min="1" data-i="${i}" data-f="q" value="${esc(it.q)}" aria-label="Quantity"></td>
            <td class="t" id="t${i}">Tk 0</td>
            <td><button type="button" class="x" data-rm="${i}" aria-label="Remove item ${i + 1}">✕</button></td>
          </tr>
        `).join("");
        updateTotals();
      }

      function getCalculation() {
        let subtotal = 0;
        state.items.forEach((it, i) => {
          const lineTotal = num(it.p) * Math.max(1, Math.floor(num(it.q) || 1));
          subtotal += lineTotal;
          const cell = $("t" + i);
          if (cell) cell.textContent = tk(lineTotal);
        });
        const discount = Math.min(subtotal, num(state.discount));
        const deliveryCharge = ZN[state.zoneIndex][3];
        const grandTotal = Math.max(0, subtotal - discount + deliveryCharge);
        return { subtotal, discount, deliveryCharge, grandTotal };
      }

      function updateTotals() {
        const { subtotal, discount, deliveryCharge, grandTotal } = getCalculation();
        $("sub").textContent = tk(subtotal);
        const discRow = $("discRow");
        if (discount > 0) {
          discRow.classList.remove("hidden");
          $("discVal").textContent = "- " + tk(discount);
        } else {
          discRow.classList.add("hidden");
        }
        $("dc").textContent = tk(deliveryCharge);
        $("tot").textContent = tk(grandTotal);
        saveState();
      }

      function buildQuotationText() {
        const D = "━━━━━━━━━━━━━━";
        const lines = ["Price Quotation:", D];
        if (state.custName.trim()) {
          lines.push("Customer: " + state.custName.trim(), D);
        }
        let validCount = 0;
        state.items.forEach((it) => {
          const name = it.n.trim();
          if (!name) return;
          validCount++;
          const qty = Math.max(1, Math.floor(num(it.q) || 1));
          const unitPrice = num(it.p);
          const lineTotal = unitPrice * qty;
          if (validCount > 1) lines.push("");
          lines.push(
            "Product: " + name,
            `Price: ${tk(unitPrice)} × ${qty} ${qty === 1 ? "Pc" : "Pcs"} = ${tk(lineTotal)}`
          );
        });
        if (!validCount) return "";
        const { subtotal, discount, deliveryCharge, grandTotal } = getCalculation();
        const z = ZN[state.zoneIndex];
        lines.push(D, "Subtotal: " + tk(subtotal));
        if (discount > 0) lines.push("Discount: -" + tk(discount));
        lines.push(
          "Delivery Charge: " + tk(deliveryCharge),
          "Total Payment: " + tk(grandTotal),
          "Full Cash on Delivery ✅",
          D,
          "Facebook Page: S.R. PRIME MART",
          "Contact: 01600-445389 (WhatsApp)",
          "",
          "Delivery Date: " + dtxt(z)
        );
        return lines.join("\n");
      }

      function setBtnFeedback(btn, originalLabel, message) {
        btn.textContent = message;
        clearTimeout(btn._timer);
        btn._timer = setTimeout(() => { btn.textContent = originalLabel; }, 1800);
      }

      function copyText(text, btn, originalLabel, requireProduct = false) {
        if (requireProduct && !text) {
          setBtnFeedback(btn, originalLabel, "Add a product first");
          return;
        }
        const fallbackCopy = () => {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          let ok = false;
          try { ok = document.execCommand("copy"); } catch (_) {}
          document.body.removeChild(ta);
          setBtnFeedback(btn, originalLabel, ok ? "Copied ✓" : "Copy failed");
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            () => setBtnFeedback(btn, originalLabel, "Copied ✓"),
            fallbackCopy
          );
        } else {
          fallbackCopy();
        }
      }

      $("cpy").addEventListener("click", function () {
        copyText(buildQuotationText(), this, "Copy Price Quotation", true);
      });

      $("ofb").addEventListener("click", function () {
        copyText([
          "অর্ডার করার জন্য নিচের তথ্যগুলো দিন:",
          "",
          "১. আপনার নাম: ",
          "২. মোবাইল নম্বর: ",
          "৩. সম্পূর্ণ ঠিকানা:"
        ].join("\n"), this, "Copy Order Form");
      });

      $("fbb").addEventListener("click", function () {
        copyText([
          "🛍️ আমাদের ফেসবুক পেজ: (Follow)",
          "https://www.facebook.com/SRPRIMEMART",
          "S.R. Prime Mart-এর পাশে থাকার জন্য ধন্যবাদ।"
        ].join("\n"), this, "Copy Facebook Page Message");
      });

      $("add").addEventListener("click", () => {
        state.items.push({ n: "", p: "", q: 1 });
        renderRows();
      });

      $("rows").addEventListener("input", (e) => {
        const i = e.target.getAttribute("data-i");
        const f = e.target.getAttribute("data-f");
        if (i !== null && f !== null && state.items[i]) {
          state.items[i][f] = e.target.value;
          updateTotals();
        }
      });

      $("rows").addEventListener("click", (e) => {
        const rm = e.target.getAttribute("data-rm");
        if (rm !== null) {
          state.items.splice(Number(rm), 1);
          if (!state.items.length) state.items.push({ n: "", p: "", q: 1 });
          renderRows();
        }
      });

      $("zs").addEventListener("change", (e) => {
        state.zoneIndex = Number(e.target.value) || 0;
        fillDel();
        updateTotals();
      });

      $("custName").addEventListener("input", (e) => {
        state.custName = e.target.value;
        saveState();
      });

      $("discount").addEventListener("input", (e) => {
        state.discount = e.target.value;
        updateTotals();
      });

      $("clearAll").addEventListener("click", () => {
        state = { custName: "", discount: "", zoneIndex: 0, items: [{ n: "", p: "", q: 1 }] };
        $("custName").value = "";
        $("discount").value = "";
        $("zs").value = "0";
        fillDel();
        renderRows();
      });

      $("themeToggle").addEventListener("click", () => {
        const root = document.documentElement;
        const isDark = root.getAttribute("data-theme") === "dark";
        root.setAttribute("data-theme", isDark ? "light" : "dark");
      });

      loadState();
      $("custName").value = state.custName;
      $("discount").value = state.discount;
      $("zs").value = String(state.zoneIndex);
      fillDel();
      renderRows();
    })();
  </script>
</body>
</html>
