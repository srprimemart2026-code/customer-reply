<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S.R. PRIME MART – Price Quotation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>S.R. PRIME MART</h1>
<p class="sub">Price Quotation</p>
<div style="position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:6px"><button id="cpy" class="pri" style="margin:0">Copy Price Quotation</button><button id="ofb" class="pri" style="margin:0">Copy Order Form</button><button id="fbb" class="pri" style="margin:0">Copy Facebook Page Message</button></div>

<section>
<div class="wrap">
<table>
<thead><tr><th>Product Name</th><th>Price (Tk)</th><th>Quantity</th><th>Total</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<button id="add">+ Add product</button>
<div class="sum">
<div><span>Delivery Charge</span><span id="dc">Tk 70</span></div>
<div class="big"><span>Total Payment</span><span id="tot">Tk 0</span></div>
<div><span>Payment</span><span><b>Full Cash on Delivery</b></span></div>
</div>
</section>

<section>
<h2>Delivery time</h2>
<select id="zs" aria-label="Delivery area"><option value="0">Inside Dhaka</option><option value="1">Dhaka sub areas</option><option value="2">Outside Dhaka</option></select>
<dl>
<div><dt id="dn">Inside Dhaka</dt><dd id="d0">1-2 days</dd></div>
</dl>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
